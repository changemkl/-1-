name: Collect customer intelligence
on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: '可选：客户集团编号；留空采集全部已配置来源'
        required: false
        type: string
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: read
concurrency:
  group: customer-intelligence-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect into independent D1 database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTOMER_ID: ${{ inputs.customer_id }}
        run: |
          if [ -n "$CUSTOMER_ID" ]; then
            python intelligence/collector.py --customer-id "$CUSTOMER_ID"
          else
            python intelligence/collector.py
          fi
